server:
  port: 8085

spring:
  application:
    name: payment-service
  datasource:
    url: jdbc:postgresql://localhost:5432/payment_db?currentSchema=payment_service,public
    username: postgres
    password: postgrespassword
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        default_schema: payment_service
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: payment-group
      auto-offset-reset: earliest

payment:
  booking-service:
    url: "${PAYMENT_BOOKING_SERVICE_URL:http://localhost:8083}"
  commission:
    rate: 0.15
  system:
    escrow-user-id: "00000000-0000-0000-0000-000000000001"
    revenue-user-id: "00000000-0000-0000-0000-000000000002"
  momo:
    partner-code: "${MOMO_PARTNER_CODE:MOMOBKUN20180529}"
    access-key: "${MOMO_ACCESS_KEY:klm05TvNBzhg7h7j}"
    secret-key: "${MOMO_SECRET_KEY:at67qH6mk8w5Y1nAyMoYKMWACiEi2bsa}"
    endpoint: "${MOMO_ENDPOINT:https://test-payment.momo.vn/v2/gateway/api/create}"
    redirect-url: "${MOMO_REDIRECT_URL:http://localhost:3000/payment/result}"
    ipn-url: "${MOMO_IPN_URL:http://203.145.46.255:8085/api/v1/wallets/webhook/momo}"

