server:
  port: 8085

spring:
  application:
    name: payment-service
  datasource:
    url: jdbc:postgresql://localhost:5432/payment_db?currentSchema=payment_service,public
    username: postgres
    password: postgrespassword
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        default_schema: payment_service
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: payment-group
      auto-offset-reset: earliest

payment:
  booking-service:
    url: "${PAYMENT_BOOKING_SERVICE_URL:http://localhost:8083}"
  commission:
    rate: 0.15
  system:
    escrow-user-id: "00000000-0000-0000-0000-000000000001"
    revenue-user-id: "00000000-0000-0000-0000-000000000002"
  vnpay:
    tmn-code: "${VNPAY_TMN_CODE:2QX72L2E}"
    hash-secret: "${VNPAY_HASH_SECRET:RAK88456789012345678901234567890}"
    url: "${VNPAY_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}"
    return-url: "${VNPAY_RETURN_URL:https://muamake.duckdns.org/payment/vnpay/callback}"
    ipn-url: "${VNPAY_IPN_URL:https://muamake.duckdns.org/api/v1/wallets/webhook/vnpay}"

